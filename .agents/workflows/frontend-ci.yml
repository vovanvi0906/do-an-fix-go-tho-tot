name: Frontend Admin Web CI

on:
  push:
    paths:
      - 'doan-kttn-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'doan-kttn-frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doan-kttn-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: doan-kttn-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vite App
        run: npm run build
