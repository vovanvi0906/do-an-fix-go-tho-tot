version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: ondemand_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ondemand_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M
    mem_limit: 300m
    mem_reservation: 128m
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c max_connections=50
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ondemand_db']
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: ondemand_redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - '6379:6379'
      - '6380:6379'
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 80M
        reservations:
          memory: 32M
    mem_limit: 80m
    mem_reservation: 32m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local